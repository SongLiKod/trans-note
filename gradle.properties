org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# ===== 版本号唯一修改处 =====
# 只需修改下面的 APP_VERSION_NAME（语义化 x.y.z），versionCode 由脚本自动计算生成。
APP_VERSION_NAME=1.4.0
# ===========================

# 该环境为 aarch64，AGP 默认从 Maven 拉取的 aapt2 为 x86_64 原生二进制无法直接运行，
# 使用 SDK build-tools 提供的 qemu 包装版 aapt2。
android.aapt2FromMavenOverride=/data/user/0/com.mobilecoder.ide/files/sdk/build-tools/34.0.0/aapt2
